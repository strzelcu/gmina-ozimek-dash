name: Check dashboards and publish legacy redirect
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('dashboard-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci
      - run: npm ci --prefix dashboard
      - name: Check locality configuration and unit tests
        run: |
          node --test tests/*.test.ts
          npm run check --prefix dashboard
      - name: Build official locality dashboards
        run: npm run build --prefix dashboard
      - name: Verify waste calendar imports
        run: |
          python3 -m venv "$RUNNER_TEMP/ozimek-khal"
          "$RUNNER_TEMP/ozimek-khal/bin/python" -m pip install 'khal==0.14.1'
          KHAL_BIN="$RUNNER_TEMP/ozimek-khal/bin/khal" npm run test:calendars --prefix dashboard
      - name: Install Chromium for Playwright
        working-directory: dashboard
        run: npx playwright install --with-deps --only-shell chromium
      - name: Check responsive dashboard layout
        id: responsive
        run: npm run test:responsive --prefix dashboard
      - name: Save browser test results on failure
        if: failure() && steps.responsive.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: responsive-test-results-${{ github.run_attempt }}
          path: dashboard/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: redirect
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
